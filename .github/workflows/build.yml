name: HabitFlow CI / Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    name: Test & Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install System Dependencies (WebKitGTK)
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1 libgirepository1.0-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pywebview bottle flake8 pytest

    - name: Lint Code with Flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

    - name: Test Database Initialization & CRUD Queries
      run: |
        python -c "
        import database
        database.init_db('test.db')
        data = database.get_dashboard_data('test.db')
        assert len(data['habits']) == 5, 'Default seed habits missing'
        h_id = database.add_habit('Test Routine', 'Work', 'ph-laptop', 5, db_path='test.db')
        assert database.toggle_habit_check(h_id, '2026-10-14', db_path='test.db') == True
        assert database.delete_habit(h_id, db_path='test.db') == True
        print('All database integrity tests passed!')
        "

  package-release:
    name: Package Release Artifacts
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Create Release Tarball
      run: |
        mkdir -p dist
        tar --exclude='.git' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='*.db' \
            -czvf dist/habitflow-linux-x86_64.tar.gz .
        ls -lh dist/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: habitflow-linux-x86_64
        path: dist/habitflow-linux-x86_64.tar.gz
